services:
  mysql:
    image: mysql:8.0
    container_name: agrogestao-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agrogestao
      MYSQL_USER: agrogestao
      MYSQL_PASSWORD: agrogestao
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - agrogestao_mysql_data:/var/lib/mysql

  # Caixa de e-mail falsa para desenvolvimento: SMTP em 1025, interface web em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: agrogestao-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  agrogestao_mysql_data:
