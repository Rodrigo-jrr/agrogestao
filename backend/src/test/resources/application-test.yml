spring:
  datasource:
    url: jdbc:h2:mem:agrogestao;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.agrogestao: WARN

agrogestao:
  admin:
    emails: admin@plataforma.test
  # Os testes fazem centenas de cadastros/logins a partir do mesmo IP (127.0.0.1).
  security:
    login:
      max-failures-per-ip: 100000
    register:
      max-per-ip-per-hour: 100000
