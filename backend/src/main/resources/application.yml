server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agrogestao
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:agrogestao}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:agrogestao}
    password: ${DB_PASSWORD:agrogestao}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

agrogestao:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    # E-mails com acesso ao painel de administração da plataforma (separados por vírgula)
    emails: ${PLATFORM_ADMIN_EMAILS:rodrigojr.rezende@gmail.com}
  cors:
    # Lista separada por vírgulas; aceita padrões (ex.: https://*.agrorust.com.br)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

logging:
  level:
    com.agrogestao: INFO
