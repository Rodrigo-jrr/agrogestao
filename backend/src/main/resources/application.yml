server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agrogestao
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:agrogestao}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:agrogestao}
    password: ${DB_PASSWORD:agrogestao}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

agrogestao:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.agrogestao: INFO
