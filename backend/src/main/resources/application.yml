server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agrogestao
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:agrogestao}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:agrogestao}
    password: ${DB_PASSWORD:agrogestao}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

agrogestao:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum}
    access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  app:
    # Endereço público do frontend, usado nos links enviados por e-mail
    base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:AgroGestão <nao-responda@agrogestao.local>}
  admin:
    # E-mails com acesso ao painel de administração da plataforma (separados por vírgula)
    emails: ${PLATFORM_ADMIN_EMAILS:rodrigojr.rezende@gmail.com}
  cors:
    # Lista separada por vírgulas; aceita padrões (ex.: https://*.agrogestao.com.br)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

logging:
  level:
    com.agrogestao: INFO
