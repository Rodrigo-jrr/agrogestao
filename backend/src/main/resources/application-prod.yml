# Perfil de produção: sem valores padrão para segredos/infra. Ative com SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=${DB_USE_SSL:true}&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

agrogestao:
  app:
    base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
  admin:
    # Sem padrão em produção: nenhum admin até a variável ser definida.
    emails: ${PLATFORM_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
